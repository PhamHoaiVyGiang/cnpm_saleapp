<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class ="container">
    <div class =" row ">
        {%for p in prods%}
        <div class ="col-md-3 col-12" style ="padding:0.7rem">
            <div class="card" >
                <img class="card-img-top" src="{{p.image}}" alt="{{p.name}}">
                <div class="card-body">
                <h4 class="card-title">{{p.name}}</h4>
                <p class="card-text">{{p.price}}</p>
                <a href="#" class="btn btn-primary">Xem chi tiet</a>
                    <a href="#" class="btn btn-danger">Dat hang</a>
                </div>
              </div>
        </div>
        {%endfor%}
    </div>
</div>
</body>
</html>
